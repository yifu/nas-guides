name: Build PDFs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonts and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          pip install -r requirements.txt

      - name: Build the guides
        run: make

      - name: Keep the PDFs as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: guides-pdf
          path: build/*.pdf

      - name: Publish them as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/*.pdf \
            --target "$GITHUB_SHA" \
            --title "Derniers PDF" \
            --notes "Generated from ${GITHUB_SHA::7}"
